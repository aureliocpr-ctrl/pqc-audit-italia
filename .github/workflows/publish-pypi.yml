# Release pipeline — publishes pqc-audit-italia to PyPI with sigstore
# keyless signatures and SLSA build provenance attached.
#
# Trigger:
#   * Manual ``workflow_dispatch`` (release dry-run by maintainer).
#   * GitHub Release published — produces the real PyPI upload.
#
# Trust model:
#   * No PyPI API tokens. We rely on PyPI Trusted Publishing (OIDC)
#     so the workflow exchanges its GitHub OIDC token for a one-shot
#     PyPI upload credential. See: https://docs.pypi.org/trusted-publishers/
#   * Sigstore keyless signing also uses the same GitHub OIDC chain:
#     no long-lived signing key sits in the repo or secrets.
#   * SLSA L3 provenance is emitted by the official
#     slsa-framework/slsa-github-generator workflow, then published as
#     a GitHub release asset alongside the wheel/sdist.
#
# To enable Trusted Publishing on a fresh project the maintainer must
# create a publisher entry in https://pypi.org/manage/account/publishing/
# with:
#   * Owner: aureliocpr-ctrl
#   * Repository: pqc-audit-italia
#   * Workflow: publish-pypi.yml
#   * Environment: pypi-publish

name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target index"
        required: true
        default: "testpypi"
        type: choice
        options: [testpypi, pypi]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # 1. Reproducible build of wheel + sdist.
  # --------------------------------------------------------------------
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for sigstore signing in step 2 (same job uploads digest)
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build==1.2.2

      - name: Build
        run: python -m build

      # Hashes feed the SLSA generator below.
      - name: Hash artifacts
        id: hash
        run: |
          cd dist
          set -euo pipefail
          digests=$(sha256sum *.tar.gz *.whl | base64 -w0)
          echo "hashes=$digests" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # --------------------------------------------------------------------
  # 2. Sigstore keyless signing of every artifact in dist/.
  # --------------------------------------------------------------------
  sign:
    name: Sigstore sign
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Sign artifacts (Sigstore)
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl
          upload-signing-artifacts: true
          release-signing-artifacts: true

      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-signed
          path: dist/
          if-no-files-found: error

  # --------------------------------------------------------------------
  # 3. SLSA L3 build provenance.
  # --------------------------------------------------------------------
  provenance:
    name: SLSA provenance
    needs: [build]
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true  # attach to the GitHub release when triggered by a release event

  # --------------------------------------------------------------------
  # 4. Upload to PyPI via Trusted Publishing (OIDC).
  # --------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [sign, provenance]
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/pqc-audit-italia/
    permissions:
      id-token: write  # mandatory for Trusted Publishing
      contents: read
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-signed
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          # Keep .sigstore bundles in the artifact set even though PyPI
          # ignores them — they remain available for in-toto / cosign
          # verification of the GitHub release asset.

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
