[package]
name = "pqc_audit_dashboard"
version = "0.1.0"
description = "pqc-audit-italia desktop viewer (Tauri v2)."
authors = ["Aurelio Capriello <aureliocpr@gmail.com>"]
edition = "2021"
rust-version = "1.77"

# See https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pqc_audit_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri itself ships its own JSON model; we don't pull serde_json
# separately to keep the dependency tree minimal.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
