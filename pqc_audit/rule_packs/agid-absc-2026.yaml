# AGID ABSC (AgID Basic Security Controls) rule pack — 2026 edition
#
# Anchored to AGID Circolare 2/2017 (Misure minime di sicurezza ICT per
# le Pubbliche Amministrazioni) and successive Linee Guida. ABSC is the
# minimum baseline; this pack lifts that baseline to a PQC-ready level
# for PA contracts opened after 2026 (procurement secure-by-design).
#
# Scope:
#   * PA central, regional, local (incluso enti SSN)
#   * Fornitori in regime di Determinazione AGID (Cloud, marketplace)
#   * Strutture sanitarie su FSE / DOSSIER SANITARIO
#
# This pack is procurement-oriented: failures here are likely to block
# capitolato d'oneri compliance for new PA tenders.
#
# Schema: pqc_audit.rule_packs.schema.RulePack

name: agid-absc-2026
version: "2026.05.17"
title: AGID — ABSC Misure Minime ICT + PA PQC procurement 2026
description: >
  Italian PA cryptographic procurement baseline. Combines AGID's
  Misure Minime di Sicurezza ICT (ABSC) with the PQC-ready posture
  expected for new PA tenders. Designed to be cited verbatim in
  capitolato tecnico to give vendors an unambiguous list of allowed
  and forbidden primitives.

effective_dates:
  agid_circ_2_2017: 2017-04-18           # ABSC pubblicato in GU
  agid_linee_guida_cloud: 2022-12-29     # AGID Cloud PA prima edizione
  agid_pqc_procurement_target: 2026-12-31

provenance:
  source: AGID — Agenzia per l'Italia Digitale
  url: https://www.agid.gov.it/it/sicurezza/misure-minime-sicurezza-ict
  retrieved: 2026-05-17

applies_to:
  asset_categories:
    - tls
    - ssh
    - cert
    - jwt
    - saml
    - mtls
    - dnssec

controls:
  # --- ABSC hard-fail legacy ----------------------------------------
  - id: AGID-ABSC-001
    description: >
      MD5 espressamente escluso da ABSC per le PA italiane: nessun
      uso ammissibile in autenticazione, firma o integrità.
    rule_type: forbid
    algorithm: MD5
    severity: CRITICAL
    references:
      - https://www.agid.gov.it/it/sicurezza/misure-minime-sicurezza-ict

  - id: AGID-ABSC-002
    description: >
      SHA-1 escluso da ABSC per nuove implementazioni PA. Legacy
      ammesso solo con piano di sostituzione tracciato.
    rule_type: forbid
    algorithm: SHA-1
    severity: CRITICAL
    references:
      - https://www.agid.gov.it/it/sicurezza/misure-minime-sicurezza-ict

  - id: AGID-ABSC-003
    description: >
      RSA-1024 sotto la soglia minima ABSC. Non ammesso in
      capitolati PA 2026+.
    rule_type: forbid
    algorithm: RSA-1024
    severity: CRITICAL
    references:
      - https://www.agid.gov.it/it/sicurezza/misure-minime-sicurezza-ict

  - id: AGID-ABSC-004
    description: >
      3DES non più accettato in ABSC.
    rule_type: forbid
    algorithm: 3DES
    severity: CRITICAL
    references:
      - https://www.agid.gov.it/it/sicurezza/misure-minime-sicurezza-ict

  - id: AGID-ABSC-005
    description: >
      RC4 escluso da qualsiasi configurazione TLS/PA.
    rule_type: forbid
    algorithm: RC4
    severity: CRITICAL
    references:
      - https://www.agid.gov.it/it/sicurezza/misure-minime-sicurezza-ict

  # --- AGID Cloud PA — minimum baseline ------------------------------
  - id: AGID-CLOUD-001
    description: >
      Le piattaforme Cloud per la PA italiana devono offrire TLS 1.3
      con suite AES-256-GCM o ChaCha20-Poly1305; ChaCha20 ammesso ove
      richiesto da mobile-first profiles.
    rule_type: allow
    algorithm: ChaCha20-Poly1305
    severity: INFO
    references:
      - https://cloud.italia.it/

  - id: AGID-CLOUD-002
    description: >
      AES-128-GCM consentito per backwards compatibility nei servizi
      Cloud AGID-qualificati; AES-256-GCM raccomandato.
    rule_type: allow
    algorithm: AES-128-GCM
    severity: INFO
    references:
      - https://cloud.italia.it/

  # --- PA PQC procurement 2026 (post-NIS2 + CRA) ---------------------
  - id: AGID-PQC-001
    description: >
      ML-KEM-768 raccomandato come default KEM nei capitolati PA per
      forniture ICT dal 2026 in poi (allineamento NIST/ENISA).
    rule_type: allow
    algorithm: ML-KEM-768
    severity: INFO
    references:
      - https://www.agid.gov.it/

  - id: AGID-PQC-002
    description: >
      ML-DSA-65 raccomandato come firma di default nei nuovi
      capitolati PA dal 2026 per autenticità dei documenti.
    rule_type: allow
    algorithm: ML-DSA-65
    severity: INFO
    references:
      - https://www.agid.gov.it/

  - id: AGID-PQC-003
    description: >
      RSA-2048 in deprecazione progressiva: nei nuovi capitolati PA
      dovrà essere accompagnato da una migration roadmap PQC entro la
      scadenza NIST 2030.
    rule_type: deprecate_after
    algorithm: RSA-2048
    severity: HIGH
    effective: 2030-01-01
    references:
      - https://www.agid.gov.it/
      - https://csrc.nist.gov/pubs/ir/8547/initial-public-draft
