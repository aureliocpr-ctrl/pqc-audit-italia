# FIPS 203/204/205 STRICT rule pack — 2026 edition
#
# Hardened variant of nist-core-2026: instead of granting classical
# algorithms a transition window until 2030/2035 (NIST IR 8547), this
# pack forbids them outright. Intended use cases:
#
#   * NSA CNSA 2.0 environments (Commercial National Security Algorithm
#     Suite 2.0, NSS CP-3-2022) which already require PQC by 2025-2030.
#   * Classified or defense-aerospace deployments that cannot rely on
#     RSA/ECC harvest-now-decrypt-later windows.
#   * High-assurance financial workloads choosing to front-load the
#     PQC migration ahead of the regulatory deadline.
#
# Composing this pack with nist-core-2026 is intentional: the STRICT
# forbids win over the lenient deprecate_after rules (CompiledRuleSet
# merge: a forbidden algorithm cannot be also allowed).
#
# Schema: pqc_audit.rule_packs.schema.RulePack

name: fips-203-204-205-strict-2026
version: "2026.05.17"
title: FIPS 203/204/205 STRICT — classical RSA/ECC disallowed in 2026
description: >
  Strict allow-list aligned to NSA CNSA 2.0 timeline. Every FIPS-approved
  PQC primitive is explicitly allowed; classical RSA/ECDSA/ECDH are
  forbidden (not merely deprecated). Pair with nist-core-2026 only when
  you want the STRICT side to override transitional tolerance.

effective_dates:
  fips_203_final: 2024-08-13              # ML-KEM (Kyber)
  fips_204_final: 2024-08-13              # ML-DSA (Dilithium)
  fips_205_final: 2024-08-13              # SLH-DSA (SPHINCS+)
  cnsa_2_0_published: 2022-09-07          # NSA CNSA 2.0
  cnsa_2_0_target_2030: 2030-12-31        # CNSA 2.0 full migration target
  strict_classical_forbid: 2026-01-01

provenance:
  source: NIST / NSA CNSA 2.0
  url: https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF
  retrieved: 2026-05-17

applies_to:
  asset_categories:
    - tls
    - ssh
    - cert
    - jwt
    - saml
    - mtls
    - dnssec

controls:
  # --- FIPS-approved PQC primitives -----------------------------------
  - id: FIPS-STRICT-KEM-001
    description: ML-KEM-768 is the CNSA 2.0 KEM (FIPS 203).
    rule_type: allow
    algorithm: ML-KEM-768
    severity: INFO
    references:
      - https://csrc.nist.gov/pubs/fips/203/final
      - https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF

  - id: FIPS-STRICT-KEM-002
    description: ML-KEM-1024 is approved for higher security categories.
    rule_type: allow
    algorithm: ML-KEM-1024
    severity: INFO
    references:
      - https://csrc.nist.gov/pubs/fips/203/final

  - id: FIPS-STRICT-SIG-001
    description: ML-DSA-65 is the CNSA 2.0 signature scheme (FIPS 204).
    rule_type: allow
    algorithm: ML-DSA-65
    severity: INFO
    references:
      - https://csrc.nist.gov/pubs/fips/204/final
      - https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF

  - id: FIPS-STRICT-SIG-002
    description: ML-DSA-87 is approved for higher security categories.
    rule_type: allow
    algorithm: ML-DSA-87
    severity: INFO
    references:
      - https://csrc.nist.gov/pubs/fips/204/final

  - id: FIPS-STRICT-SIG-101
    description: SLH-DSA-SHA2-192s is approved (FIPS 205) for firmware/root signing.
    rule_type: allow
    algorithm: SLH-DSA-SHA2-192s
    severity: INFO
    references:
      - https://csrc.nist.gov/pubs/fips/205/final

  # --- Classical algorithms — FORBIDDEN, no transition tolerance -----
  - id: FIPS-STRICT-FORBID-RSA-2048
    description: >
      RSA-2048 is forbidden under STRICT mode regardless of the NIST
      IR 8547 transition tolerance. Front-load the migration.
    rule_type: forbid
    algorithm: RSA-2048
    severity: HIGH
    references:
      - https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF

  - id: FIPS-STRICT-FORBID-RSA-3072
    description: RSA-3072 forbidden under STRICT mode (same rationale as RSA-2048).
    rule_type: forbid
    algorithm: RSA-3072
    severity: HIGH
    references:
      - https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF

  - id: FIPS-STRICT-FORBID-ECDSA-P256
    description: ECDSA-P-256 forbidden under STRICT mode.
    rule_type: forbid
    algorithm: ECDSA-P-256
    severity: HIGH
    references:
      - https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF

  - id: FIPS-STRICT-FORBID-ECDSA-P384
    description: ECDSA-P-384 forbidden under STRICT mode.
    rule_type: forbid
    algorithm: ECDSA-P-384
    severity: HIGH
    references:
      - https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF

  - id: FIPS-STRICT-FORBID-ECDH-P256
    description: ECDH-P-256 forbidden under STRICT mode.
    rule_type: forbid
    algorithm: ECDH-P-256
    severity: HIGH
    references:
      - https://media.defense.gov/2022/Sep/07/2003071834/-1/-1/0/CSA_CNSA_2.0_ALGORITHMS_.PDF

  # --- Pre-existing hard-fail primitives (re-asserted) ---------------
  - id: FIPS-STRICT-FORBID-MD5
    description: MD5 forbidden — no remaining valid FIPS use.
    rule_type: forbid
    algorithm: MD5
    severity: CRITICAL
    references:
      - https://csrc.nist.gov/projects/hash-functions

  - id: FIPS-STRICT-FORBID-SHA1
    description: SHA-1 forbidden — withdrawn from FIPS approval in 2024.
    rule_type: forbid
    algorithm: SHA-1
    severity: CRITICAL
    references:
      - https://csrc.nist.gov/projects/hash-functions

  - id: FIPS-STRICT-FORBID-RSA1024
    description: RSA-1024 below minimum allowed key size.
    rule_type: forbid
    algorithm: RSA-1024
    severity: CRITICAL
    references:
      - https://csrc.nist.gov/pubs/sp/800/131/a/r2/final

  - id: FIPS-STRICT-FORBID-3DES
    description: 3DES retired by NIST as of SP 800-131A Rev. 2.
    rule_type: forbid
    algorithm: 3DES
    severity: CRITICAL
    references:
      - https://csrc.nist.gov/pubs/sp/800/131/a/r2/final

  - id: FIPS-STRICT-FORBID-RC4
    description: RC4 stream cipher forbidden (RFC 7465).
    rule_type: forbid
    algorithm: RC4
    severity: CRITICAL
    references:
      - https://datatracker.ietf.org/doc/html/rfc7465
